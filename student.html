<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Management System registration page">
    <title>Student Management System</title>
    <link rel="stylesheet" href="/styles/student.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="#home" aria-label="Campus Desk home">
                <span class="brand-mark" aria-hidden="true">CD</span>
                <span>Campus Desk</span>
            </a>
            <nav aria-label="Main navigation">
                <a href="#home">Home</a>
                <a href="#registration" aria-current="page">Student Registration</a>
                <a href="#footer">Contact</a>
            </nav>
        </div>
    </header>

    <main id="home">
        <section class="page-heading" aria-labelledby="page-title">
            <p class="eyebrow">Student services</p>
            <h1 id="page-title">Student Registration</h1>
            <p>Enter the student's details below to create a new student record.</p>
        </section>

        <section class="registration" id="registration" aria-labelledby="form-title">
            <div class="section-heading">
                <h2 id="form-title">Student information</h2>
                <p>Fields marked <span aria-hidden="true">*</span> are required.</p>
            </div>

            <form action="#" method="post">
                <fieldset>
                    <legend>Personal details</legend>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="first-name">First name <span aria-hidden="true">*</span></label>
                            <input type="text" id="first-name" name="first-name" autocomplete="given-name" required>
                        </div>
                        <div class="form-field">
                            <label for="last-name">Last name <span aria-hidden="true">*</span></label>
                            <input type="text" id="last-name" name="last-name" autocomplete="family-name" required>
                        </div>
                        <div class="form-field">
                            <label for="date-of-birth">Date of birth <span aria-hidden="true">*</span></label>
                            <input type="date" id="date-of-birth" name="date-of-birth" autocomplete="bday" required>
                        </div>
                        <div class="form-field">
                            <label for="student-email">Email address <span aria-hidden="true">*</span></label>
                            <input type="email" id="student-email" name="student-email" autocomplete="email" required>
                        </div>
                        <div class="form-field">
                            <label for="phone">Phone number</label>
                            <input type="tel" id="phone" name="phone" autocomplete="tel">
                        </div>
                        <div class="form-field">
                            <label for="student-id">Student ID</label>
                            <input type="text" id="student-id" name="student-id" autocomplete="off">
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Enrollment details</legend>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="program">Program of study <span aria-hidden="true">*</span></label>
                            <select id="program" name="program" required>
                                <option value="" selected disabled>Select a program</option>
                                <option value="business">Business Administration</option>
                                <option value="computing">Computer Science</option>
                                <option value="education">Education</option>
                                <option value="arts">Fine Arts</option>
                                <option value="science">Natural Sciences</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="start-date">Enrollment date <span aria-hidden="true">*</span></label>
                            <input type="date" id="start-date" name="start-date" required>
                        </div>
                    </div>
                </fieldset>

                <div class="form-actions">
                    <button type="reset" class="button button-secondary">Clear form</button>
                    <button type="submit" class="button button-primary">Register student</button>
                </div>
            </form>
        </section>
    </main>

    <footer id="footer">
        <p>&copy; 2026 Campus Desk Student Management System</p>
    </footer>
</body>
</html>
