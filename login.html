<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your Northstar account.">
    <title>Sign In | Northstar</title>
    <link rel="stylesheet" href="/styles/login.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <a class="brand" href="#" aria-label="Northstar home">
                <span class="brand-mark" aria-hidden="true">N</span>
                <span>northstar</span>
            </a>

            <div class="card-heading">
                <p class="eyebrow">MEMBER ACCESS</p>
                <h1 id="login-title">Welcome back</h1>
                <p>Sign in to continue to your account.</p>
            </div>

            <form action="#" method="post">
                <div class="form-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter your username" required>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
                </div>

                <div class="form-options">
                    <label class="remember-option" for="remember-me">
                        <input type="checkbox" id="remember-me" name="remember-me">
                        <span>Remember me</span>
                    </label>
                    <a class="text-link" href="#forgot-password">Forgot password?</a>
                </div>

                <button class="login-button" type="submit">Log in</button>
            </form>

            <p class="register-prompt">New to Northstar? <a class="text-link" href="#register">Create an account</a></p>
            <p class="privacy-note">Your account details are protected and encrypted.</p>
        </section>
    </main>
</body>
</html>
